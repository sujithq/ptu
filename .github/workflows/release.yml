name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # NuGet trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags for versionize release notes

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            11.0.100-preview.5.26302.115

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack src/Ptu.Cli --configuration Release

      # Exchanges this workflow's OIDC token for a short-lived NuGet API key.
      # Requires a Trusted Publishing policy on nuget.org for sujithq/ptu + release.yml.
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: sujithq

      - name: Push to NuGet.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Generate release notes from conventional commits
        run: |
          dotnet tool restore
          dotnet versionize changelog --version "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" artifacts/*.nupkg --title "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
