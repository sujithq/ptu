name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # NuGet trusted publishing (OIDC) + attestation signing
      attestations: write # store build provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history + tags for versionize release notes

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: |
            10.0.x
            11.0.100-preview.5.26302.115

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack src/Ptu.Cli --configuration Release

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: artifacts/*.nupkg

      # Exchanges this workflow's OIDC token for a short-lived NuGet API key.
      # Requires a Trusted Publishing policy on nuget.org for sujithq/ptu + release.yml.
      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: sujithq

      - name: Push to NuGet.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Generate release notes from conventional commits
        run: |
          dotnet tool restore
          dotnet versionize changelog --version "${GITHUB_REF_NAME#v}" > RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "sujithq.ptu.cli.${GITHUB_REF_NAME#v}.intoto.jsonl"
          gh release create "${{ github.ref_name }}" artifacts/*.nupkg "sujithq.ptu.cli.${GITHUB_REF_NAME#v}.intoto.jsonl" --title "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
